services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strawberry_ai}
      POSTGRES_USER: ${POSTGRES_USER:-strawberry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://strawberry:change-me-for-local-development@db:5432/strawberry_ai}
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  postgres_data:
